# FlowForge WORKER node #2 – node-specific settings only (shared settings come from etcd/MongoDB).
node:
  id: worker-2
  tags: [ default ]

grpc:
  host: 127.0.0.1
  port: ${WORKER2_GRPC_PORT:-50062}

http:
  port: ${WORKER2_HTTP_PORT:-3102}

shared:
  source: etcd
  etcd:
    hosts: [ "${ETCD_HOSTS:-127.0.0.1:2379}" ]
    prefix: /flowforge/
  # A cluster that keeps its shared config in MongoDB instead:
  # source: mongo
  # mongo:
  #   url: ${MONGO_URL:-mongodb://127.0.0.1:27017}
  #   db: flowforge
