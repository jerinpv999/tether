# Any master can serve the API, designer and /hooks/*; followers forward
# runtime calls to the leader, so plain round-robin with health checks is enough.
upstream flowforge_masters {
  server master-1:3000 max_fails=2 fail_timeout=5s;
  server master-2:3001 max_fails=2 fail_timeout=5s;
}

server {
  listen 80;
  client_max_body_size 10m;

  location /api/stream {               # Server-Sent Events
    proxy_pass http://flowforge_masters;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://flowforge_masters;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;            # sync webhooks wait for the Response node
    proxy_next_upstream error timeout http_502 http_503;
  }
}
